org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# Saját frissítés (C. 14., D-062): a RepoShelf saját GitHub-repója (owner/name). A repó még nincs publikálva (Q-008).
reposhelf.selfUpdate.repo=X1wer/reposhelf
# A release-aláíró tanúsítványának SHA-256 ujjlenyomata(i), vesszővel, kisbetűs hex. Üres: a futó app saját aláírója
# az elvárt. A valódi release-kulcs létrehozása a felhasználó döntése (Q-007, 9. munkamenet).
reposhelf.selfUpdate.signerSha256=

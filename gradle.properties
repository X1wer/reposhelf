org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# Verzió (D-130): a release-tag (vX.Y.Z) a versionName-mel egyezik, a versionCode kiadásonként nő. A release-workflow
# ellenőrzi, hogy a tag és a CHANGELOG.md ehhez a verzióhoz tartozik. Teszt-buildekhez -P-vel felülírható.
reposhelf.versionName=0.1.0
reposhelf.versionCode=1

# Saját frissítés (C. 14., D-062): a RepoShelf saját GitHub-repója (owner/name). A repó még nincs publikálva (Q-008).
# Csak a `github` változatban; az `fdroid` változatban a saját frissítés nincs beépítve (D-042).
reposhelf.selfUpdate.repo=X1wer/reposhelf
# A release-aláíró tanúsítványának SHA-256 ujjlenyomata(i), vesszővel, kisbetűs hex. Üres: a futó app saját aláírója
# az elvárt. A valódi release-kulcs létrehozása a felhasználó döntése (Q-007, 9. munkamenet).
reposhelf.selfUpdate.signerSha256=

# A katalógus-aláírás megbízható nyilvános kulcsai (C. 3.2., docs/ARCHITECTURE.md 7.3.): keyId:base64(SubjectPublicKeyInfo),
# vesszővel. A valódi kulcs (catalog/keys/catalog-2026a.pub; Q-006, D-142); a privát rész a repókon kívül van.
reposhelf.catalog.publicKeys=catalog-2026a:MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEmqQse4aU4tSUJ2PdYJwTUQcYtN3OMabhR654kqUTdL5LtS8hNtXEcSnWl5T+xpV8d6dlrZyh7cNmEixpW4BoLQ==
